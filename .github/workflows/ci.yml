name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which platform jobs a change needs, so a server-only change
  # doesn't start a macOS runner.
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      apple: ${{ steps.filter.outputs.apple }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'crates/protocol/**'
              - 'crates/core/**'
              - 'crates/ffi/**'
              - 'proto/**'
              - 'Cargo.lock'
            apple:
              - 'apple/**'
              - 'scripts/xcode-build-rust.sh'
            android:
              - 'android/**'
              - 'scripts/android-build-rust.sh'

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: scripts/kill-test.sh
      - run: scripts/bindings.sh --check

  apple:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.apple == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: iOS Simulator build
        run: xcodebuild -project apple/Messenger.xcodeproj -scheme Messenger -destination 'generic/platform=iOS Simulator' -configuration Debug build CODE_SIGNING_ALLOWED=NO
      - name: macOS build
        run: xcodebuild -project apple/Messenger.xcodeproj -scheme Messenger -destination 'platform=macOS' -configuration Debug build CODE_SIGNING_ALLOWED=NO

  android:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
