name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides which platform jobs a change needs, so a server-only change
  # doesn't start a macOS runner. Plain git, no API calls.
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.diff.outputs.core }}
      apple: ${{ steps.diff.outputs.apple }}
      android: ${{ steps.diff.outputs.android }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BASE" HEAD)"
          else
            files="$(git ls-files)"  # new branch or unknown base: build everything
          fi
          match() { if grep -Eq "$1" <<<"$files"; then echo true; else echo false; fi; }
          echo "core=$(match '^(crates/(protocol|core|ffi)/|proto/|Cargo\.lock$)')" >> "$GITHUB_OUTPUT"
          echo "apple=$(match '^(apple/|scripts/xcode-build-rust\.sh$)')" >> "$GITHUB_OUTPUT"
          echo "android=$(match '^(android/|scripts/android-build-rust\.sh$|\.cargo/)')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: scripts/kill-test.sh
      - run: scripts/bindings.sh --check

  apple:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.apple == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: iOS Simulator build
        run: |
          set -o pipefail
          xcodebuild -project apple/Messenger.xcodeproj -scheme Messenger -destination 'generic/platform=iOS Simulator' -configuration Debug build CODE_SIGNING_ALLOWED=NO 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - name: macOS build
        run: |
          set -o pipefail
          xcodebuild -project apple/Messenger.xcodeproj -scheme Messenger -destination 'platform=macOS' -configuration Debug build CODE_SIGNING_ALLOWED=NO 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - name: Report errors
        if: failure()
        run: scripts/ci-annotate.sh "$RUNNER_TEMP/build.log"

  android:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.android == 'true'
    # Pinned: the build uses the Android SDK and NDK that come with the image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Assemble debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Report errors
        if: failure()
        run: scripts/ci-annotate.sh "$RUNNER_TEMP/build.log"
