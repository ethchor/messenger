name: Server image

# Builds the server's Docker image and publishes it to the GitHub container
# registry, so a VPS pulls it instead of compiling Rust.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "crates/**"
      - "proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "infra/Dockerfile"
      - ".github/workflows/server-image.yml"
  # Pull requests build it without publishing, to check the Dockerfile.
  pull_request:
    paths:
      - "crates/server/**"
      - "crates/protocol/**"
      - "Cargo.lock"
      - "infra/**"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # ARM too, for ARM machines (Oracle Ampere, Hetzner CAX, a Raspberry Pi).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/messenger-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
