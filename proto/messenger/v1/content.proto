// Versioned wire formats that travel inside MLS. The server never sees them:
// they are the plaintext of MLS application messages, the identity inside
// MLS credentials, and a private-use group context extension.
//
// Compatibility rules: never reuse or renumber a field; add new fields and new
// oneof members only. Clients ignore unknown fields and unknown oneof members.

syntax = "proto3";

package messenger.v1;

// Plaintext of one MLS application message. On the wire it is framed and
// padded (see crates/protocol/src/padding.rs) before MLS encrypts it.
message Content {
  // 16 random bytes chosen by the sender. Replies, reactions, edits and
  // deletes refer to messages by this id.
  bytes id = 1;
  // Sender's clock, milliseconds since the Unix epoch. Display only.
  uint64 sent_at_ms = 2;

  oneof body {
    Text text = 10;
    Reaction reaction = 11;
    Edit edit = 12;
    Delete delete = 13;
    Receipt receipt = 14;
    Typing typing = 15;
    Location location = 16;
    Wake wake = 17;
    Profile profile = 18;
    VanishMode vanish_mode = 19;
    Screenshot screenshot = 20;
    DeviceSync device_sync = 21;
  }
}

message Text {
  string text = 1;
  // Id of the message this one replies to. Empty when not a reply.
  bytes reply_to = 2;
  // A reply in the thread under `reply_to`, shown with that thread rather
  // than in the chat. Every reply in a thread names the thread's first
  // message. Clients without threads show it as a plain reply.
  bool in_thread = 3;
  // Photos, videos, voice notes and files sent with the text, which is then
  // their caption and may be empty. At most 10.
  repeated Attachment attachments = 4;
  // Sent in vanish mode: each side deletes it once it's been seen and the
  // chat is closed, and when vanish mode is turned off.
  bool vanish = 5;
}

// Turns vanish mode on or off for everyone in a 1:1 chat, as Instagram does.
message VanishMode {
  bool on = 1;
}

// The sender took a screenshot of the chat, so the others are told.
message Screenshot {}

// Between one person's own devices, in their private device group: what
// each device does with its chats, so the others do the same.
message DeviceSync {
  repeated ChatPrefs prefs = 1;
  repeated string blocked = 2;
  repeated string unblocked = 3;
  // Chats read on the sending device.
  repeated bytes read = 4;
}

message ChatPrefs {
  bytes conversation_id = 1;
  // When it was pinned; 0 if it isn't.
  int64 pinned_at = 2;
  bool archived = 3;
  // Muted until (ms); 0 if it isn't muted.
  int64 muted_until = 4;
  bool locked = 5;
  bool marked_unread = 6;
}

// A file sent on its own: encrypted with a key made for it alone, uploaded,
// and fetched by whoever receives this. The server keeps the encrypted file
// for a while (30 days by default) and never sees the key.
//
// The file is padded with zeros to its Padmé length (at least 1 byte) and
// encrypted in 64 KiB chunks with ChaCha20-Poly1305, each chunk's nonce being
// its 11-byte big-endian number and a last-chunk flag byte, like age's STREAM,
// with "messenger attachment v1" as associated data. So a cut, reordered or
// swapped chunk fails to decrypt.
message Attachment {
  enum Kind {
    // Shown as a file.
    KIND_UNSPECIFIED = 0;
    PHOTO = 1;
    VIDEO = 2;
    VOICE = 3;
    FILE = 4;
  }
  Kind kind = 1;
  // Where the encrypted file is: GET /v1/blobs/{id}. 32 bytes.
  bytes blob_id = 2;
  // Its 32-byte key.
  bytes key = 3;
  // SHA-256 of the encrypted file, checked before it's opened.
  bytes digest = 4;
  // Size before padding and encryption.
  uint64 size = 5;
  // "image/jpeg", "video/mp4", "audio/mp4", "application/pdf"…
  string content_type = 6;
  // As the sender named it, without folders. May be empty.
  string file_name = 7;
  // Photos and videos, in pixels.
  uint32 width = 8;
  uint32 height = 9;
  // Videos and voice notes.
  uint32 duration_ms = 10;
  // Photos and videos: a small JPEG (at most 8 KiB) to show until the file
  // is fetched.
  bytes thumbnail = 11;
  // Voice notes: loudness over time, one byte (0 to 255) per step, at most
  // 256 steps, to draw the wave.
  bytes waveform = 12;
}

message Reaction {
  bytes target = 1;
  // One emoji, at most 64 bytes of UTF-8.
  string emoji = 2;
  // True removes this sender's reaction instead of adding it.
  bool remove = 3;
}

// Only the original sender's edits and deletes are applied.
message Edit {
  bytes target = 1;
  string text = 2;
}

message Delete {
  bytes target = 1;
}

// Tells the other members which of their messages the sender has read. Only
// sent while read receipts are on; a client with them off also ignores the
// receipts of others.
message Receipt {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    READ = 1;
  }
  Kind kind = 1;
  // Content ids of the messages read.
  repeated bytes targets = 2;
}

// Typing indicator. Never stored: receivers forget it after a few seconds,
// or when a message from the same sender arrives.
message Typing {
  bool typing = 1;
}

// Live location sharing. Receivers keep only the latest update from each
// sender in each conversation, never a history, and never show it in the
// chat. An update with `sharing` false means the sender stopped sharing; the
// receiver forgets their location at once.
message Location {
  bool sharing = 1;
  // When sharing ends, in milliseconds since the Unix epoch. 0: until the
  // sender stops it.
  uint64 until_ms = 2;
  // WGS 84 degrees.
  double latitude = 3;
  double longitude = 4;
  // Radius of the 68% confidence circle, in metres.
  float accuracy_m = 5;
  // When the position was measured (sender's clock).
  uint64 measured_at_ms = 6;
  optional float speed_mps = 7;
  // Direction of travel, degrees clockwise from true north.
  optional float course_deg = 8;
  // Battery level, 0 to 100.
  optional uint32 battery_percent = 9;
}

// The sender's wake token: naming it in a post makes the server push the
// sender's device (see crates/protocol/src/api.rs). Members include each
// other's tokens only with messages worth a notification. An empty token
// means the sender gets no pushes; receivers forget the one they had.
message Wake {
  bytes token = 1;
}

// How the sender appears to the others: one of the apps' line drawings and an
// ink colour, both by name ("fox", "teal"); empty for the app's default. Sent
// to every chat when it changes, and again when someone joins. Receivers keep
// the newest per account.
message Profile {
  string avatar = 1;
  string ink = 2;
  // A photo instead of the drawing: a small JPEG, sealed and uploaded like
  // any attachment. Missing: the drawing (or initial) shows.
  Attachment photo = 3;
}

// Identity carried in the MLS BasicCredential of every member.
message MemberIdentity {
  // Random 128-bit account id assigned by the server at registration.
  bytes account_id = 1;
  string username = 2;
  // A linked device (docs/LINKED-DEVICES.md). All empty for an account's
  // first device, whose MLS signature key is the account key itself.
  bytes device_id = 3;
  // The account key, which made `certificate`.
  bytes account_key = 4;
  // Where this device's invitations arrive.
  bytes intro_inbox = 5;
  // The account key's signature over
  // messenger_protocol::auth::device_certificate_payload for this device's
  // signature key.
  bytes certificate = 6;
}

// Private-use group context extension (type 0xF5A0) that every member
// supports. Being part of the group context, it is encrypted on the wire and
// agreed on by all members through the MLS key schedule.
message GroupMeta {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    DIRECT = 1;
    GROUP = 2;
    // One person's own devices, never shown as a chat.
    DEVICES = 3;
  }
  Kind kind = 1;
  string title = 2;
  // Groups: the colour picked when it was made ("rose", "blue", "green",
  // "marigold", "lilac", "graphite"); empty for none. Renaming keeps it.
  string colour = 3;
}
