# One VPS: the server behind Caddy, which gets a TLS certificate for DOMAIN.
# Settings come from infra/.env (copy .env.example):
#   docker compose -f infra/docker-compose.yml up -d           # the published image
#   docker compose -f infra/docker-compose.yml up -d --build   # or build it here
services:
  server:
    image: ${SERVER_IMAGE:-ghcr.io/ethchor/messenger-server:latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      RUST_LOG: info
    volumes:
      - server-data:/data
      # The APNs key (AuthKey_….p8), if iPhones and Macs get pushes.
      - ./secrets:/secrets:ro
    healthcheck:
      # The image has no curl; a TCP connect is enough to know it's up.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in infra/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  server-data:
  caddy-data:
  caddy-config:
