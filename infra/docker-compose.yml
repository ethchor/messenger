# The server, reached one of two ways, picked by COMPOSE_PROFILES in infra/.env:
#   caddy:  Caddy on ports 80 and 443 gets a TLS certificate for DOMAIN;
#   tunnel: a Cloudflare Tunnel, with no ports open at all.
# Settings come from infra/.env (copy .env.example):
#   docker compose -f infra/docker-compose.yml up -d           # the published image
#   docker compose -f infra/docker-compose.yml up -d --build   # or build it here
services:
  server:
    image: ${SERVER_IMAGE:-ghcr.io/ethchor/messenger-server:latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      RUST_LOG: info
    volumes:
      - server-data:/data
      # The APNs key (AuthKey_….p8), if iPhones and Macs get pushes.
      - ./secrets:/secrets:ro
    healthcheck:
      # The image has no curl; a TCP connect is enough to know it's up.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2
    profiles: [caddy]
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Connects out to Cloudflare, which sends the hostname's traffic down the
  # tunnel; set the tunnel's public hostname to http://server:8080.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    depends_on:
      - server
    # --url sends the tunnel's traffic to the server; a tunnel made in the
    # dashboard can set the same as its public hostname's service instead.
    command: tunnel --no-autoupdate run --url http://server:8080
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in infra/.env, or use the caddy profile}

volumes:
  server-data:
  caddy-data:
  caddy-config:
