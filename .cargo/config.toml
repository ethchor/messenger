# Android 15+ devices may use 16 KB memory pages; native libraries must be
# aligned for them (Google Play requires it for apps targeting Android 15).
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
